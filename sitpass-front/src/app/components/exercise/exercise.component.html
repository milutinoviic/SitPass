<div class="container">
  <h1>Create Exercise</h1>
  <form [formGroup]="form" (ngSubmit)="createExercise()">
    <label for="from">Start Date and Time:</label>
    <input type="datetime-local" id="from" formControlName="startDateTime" required>

    <label for="until">End Date and Time:</label>
    <input type="datetime-local" id="until" formControlName="endDateTime" required>

    <button type="submit" [disabled]="form.invalid">Submit</button>
  </form>
</div>
