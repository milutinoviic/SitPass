<div *ngIf="loading">Loading disciplines...</div>

<div *ngIf="!loading && disciplines.length > 0" class="disciplines-container">
  <span *ngFor="let discipline of disciplines" class="discipline-item">
    {{ discipline.name }}
  </span>
</div>

<div *ngIf="!loading && disciplines.length === 0">
  No disciplines found for this facility.
</div>
