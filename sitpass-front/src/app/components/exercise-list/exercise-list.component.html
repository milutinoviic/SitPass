<div class="exercise-container">
  <h2>User Exercises</h2>

  <table class="exercise-table" *ngIf="exercises.length > 0; else noData">
    <thead>
      <tr>
        <th>ID</th>
        <th>Facility ID</th>
        <th>From</th>
        <th>Until</th>
        <th>Actions</th> 
      </tr>
    </thead>
    <tbody>
      <tr *ngFor="let ex of exercises">
        <td>{{ ex.id }}</td>
        <td>{{ ex.facilityId }}</td>
        <td>{{ ex.from | date:'short' }}</td>
        <td>{{ ex.until | date:'short' }}</td>
        <td>
          <button 
            (click)="onDelete(ex.id)" 
            [disabled]="!canDelete(ex.from)">
            Obriši
          </button>
        </td>
      </tr>
    </tbody>
  </table>

  <ng-template #noData>
    <p>No exercises found for this user.</p>
  </ng-template>
</div>
