<div class="search-container">
  <h2>Search</h2>

  <div class="tabs">
    <button [class.active]="activeTab === 'simple'" (click)="activeTab = 'simple'">Simple Search</button>
    <button [class.active]="activeTab === 'advanced'" (click)="activeTab = 'advanced'">Advanced Search</button>
  </div>

  <!-- SIMPLE SEARCH -->
  <div *ngIf="activeTab === 'simple'" class="search-form">
    <label>Keywords:</label>
    <input type="text" [(ngModel)]="simpleKeywords" placeholder="Enter keywords..." />

    <h4>Filter by Ranges</h4>

    <div class="range-field">
      <label>Review Count:</label>
      <input type="number" [(ngModel)]="ranges['reviewCount'].min" placeholder="Min" />
      <input type="number" [(ngModel)]="ranges['reviewCount'].max" placeholder="Max" />
    </div>

    <div class="range-field">
      <label>Avg Equipment Grade:</label>
      <input type="number" [(ngModel)]="ranges['avgEquipmentGrade'].min" placeholder="Min" />
      <input type="number" [(ngModel)]="ranges['avgEquipmentGrade'].max" placeholder="Max" />
    </div>

    <div class="range-field">
      <label>Avg Staff Grade:</label>
      <input type="number" [(ngModel)]="ranges['avgStaffGrade'].min" placeholder="Min" />
      <input type="number" [(ngModel)]="ranges['avgStaffGrade'].max" placeholder="Max" />
    </div>

    <div class="range-field">
      <label>Avg Hygiene Grade:</label>
      <input type="number" [(ngModel)]="ranges['avgHygieneGrade'].min" placeholder="Min" />
      <input type="number" [(ngModel)]="ranges['avgHygieneGrade'].max" placeholder="Max" />
    </div>

    <div class="range-field">
      <label>Avg Space Grade:</label>
      <input type="number" [(ngModel)]="ranges['avgSpaceGrade'].min" placeholder="Min" />
      <input type="number" [(ngModel)]="ranges['avgSpaceGrade'].max" placeholder="Max" />
    </div>


    <label>
      <input type="checkbox" [(ngModel)]="isAsc" /> Sort ascending
    </label>

    <button (click)="onSimpleSearch()">Search</button>
  </div>

  <!-- RESULTS -->
  <div *ngIf="loading">Loading...</div>
  <div *ngIf="error">{{ error }}</div>

  <div *ngIf="results.length > 0" class="results">
    <h3>Results</h3>
    <ul>
      <li *ngFor="let f of results">
        <strong>{{ f.name }}</strong> — {{ f.descriptionSr || f.descriptionEn }}
        <br />
        Grades: Equip: {{ f.avgEquipmentGrade }}, Staff: {{ f.avgStaffGrade }},
        Hygiene: {{ f.avgHygieneGrade }}, Space: {{ f.avgSpaceGrade }},
        Reviews: {{ f.reviewCount }}
      </li>
    </ul>
  </div>
</div>
