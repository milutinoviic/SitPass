<form [formGroup]="reviewForm" (ngSubmit)="submitReview()" class="review-form">
  <h3>Submit a Review</h3>

  <div class="form-group">
    <label for="equipment">Equipment (1-5):</label>
    <input id="equipment" formControlName="equipment" type="number" min="1" max="5">
  </div>

  <div class="form-group">
    <label for="staff">Staff (1-5):</label>
    <input id="staff" formControlName="staff" type="number" min="1" max="5">
  </div>

  <div class="form-group">
    <label for="hygiene">Hygiene (1-5):</label>
    <input id="hygiene" formControlName="hygiene" type="number" min="1" max="5">
  </div>

  <div class="form-group">
    <label for="space">Space (1-5):</label>
    <input id="space" formControlName="space" type="number" min="1" max="5">
  </div>

  <div class="form-group">
    <label for="commentText">Comment (optional):</label>
    <textarea id="commentText" formControlName="commentText" rows="3"></textarea>
  </div>

  <button type="submit" [disabled]="reviewForm.invalid || !canSubmitReview">Submit Review</button>

  <p *ngIf="successMessage" class="success-message">{{ successMessage }}</p>
  <p *ngIf="errorMessage" class="error-message">{{ errorMessage }}</p>
</form>
