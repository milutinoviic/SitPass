<div class="update-facility-container">
  <h2>Update Facility</h2>

 
  <div *ngIf="successMessage" class="success-message">{{ successMessage }}</div>
  <div *ngIf="errorMessage" class="error-message">{{ errorMessage }}</div>

  <form [formGroup]="facilityForm" (ngSubmit)="submit()">
    <div class="form-group">
      <label for="name">Name</label>
      <input id="name" type="text" formControlName="name" />
      <div class="error" *ngIf="facilityForm.get('name')?.touched && facilityForm.get('name')?.invalid">
        <small *ngIf="facilityForm.get('name')?.errors?.['required']">Name is required</small>
        <small *ngIf="facilityForm.get('name')?.errors?.['minlength']">
          Name must be at least 3 characters
        </small>
      </div>
    </div>

    <div class="form-group">
      <label for="description">Description</label>
      <textarea id="description" formControlName="description"></textarea>
      <div class="error" *ngIf="facilityForm.get('description')?.touched && facilityForm.get('description')?.invalid">
        <small *ngIf="facilityForm.get('description')?.errors?.['required']">Description is required</small>
        <small *ngIf="facilityForm.get('description')?.errors?.['minlength']">
          Description must be at least 3 characters
        </small>
      </div>
    </div>

    <div class="form-group">
      <label for="address">Address</label>
      <input id="address" type="text" formControlName="address" />
      <div class="error" *ngIf="facilityForm.get('address')?.touched && facilityForm.get('address')?.invalid">
        <small *ngIf="facilityForm.get('address')?.errors?.['required']">Address is required</small>
        <small *ngIf="facilityForm.get('address')?.errors?.['minlength']">
          Address must be at least 3 characters
        </small>
      </div>
    </div>

    <div class="form-group">
      <label for="city">City</label>
      <input id="city" type="text" formControlName="city" />
      <div class="error" *ngIf="facilityForm.get('city')?.touched && facilityForm.get('city')?.invalid">
        <small *ngIf="facilityForm.get('city')?.errors?.['required']">City is required</small>
        <small *ngIf="facilityForm.get('city')?.errors?.['minlength']">
          City must be at least 3 characters
        </small>
      </div>
    </div>

    <div class="form-actions">
      <button type="submit" [disabled]="facilityForm.invalid">Update Facility</button>
    </div>
  </form>
</div>
